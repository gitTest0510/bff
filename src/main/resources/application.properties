spring.application.name=bff

# 外部API呼び出し
bff.api-call.timeout=3s
bff.api-call.fan-out-concurrency=10

# HTTP クライアントのタイムアウト（mode=http の外部APIに適用）
# 実際の通信を打ち切るため、bff.api-call.timeout より短くする
spring.http.clients.connect-timeout=1s
spring.http.clients.read-timeout=2s

# 外部APIクライアント（API 毎に指定する）
#   mode: stub（既定。固定値を返すスタブ） / http（実際に HTTP で呼び出す）
#   base-url: 接続先。mode=http のとき必須
bff.external-api.api1.mode=stub
#bff.external-api.api1.base-url=https://api1.example.com
bff.external-api.api2.mode=stub
#bff.external-api.api2.base-url=https://api2.example.com
bff.external-api.api3.mode=stub
#bff.external-api.api3.base-url=https://api3.example.com